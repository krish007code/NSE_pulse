nse_pulse_dbt:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http               # Usually 'http' or 'native'
      host: clickhouse           # Replace with your ClickHouse host IP/URL
      port: 8123                 
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PWD') }}"
      schema: default            
      
