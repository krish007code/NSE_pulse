# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'nse_pulse_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'nse_pulse_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  nse_pulse_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      # int_pairs_corr uses a non-equi self-join (ticker_a < ticker_b).
      # ClickHouse 24.1 rejects that condition when the model is inlined as a
      # CTE-in-CTE (ephemeral), raising error 403 INVALID_JOIN_ON_EXPRESSION.
      # Materialised as a view so the join runs against a named relation.
      # Downstream: only two singular tests ref this model directly; the mart
      # models (mart_correlated_pairs, mart_inverse_pairs) re-implement their
      # own correlation joins inline and are unaffected.
      int_pairs_corr:
        +materialized: view
    marts:
      +materialized: table
      +schema: mart_sentiment
      technical:
        +schema: mart_technical
      volatility:
        +schema: mart_volatility
      returns:
        +schema: mart_returns
      portfolio:
        +schema: mart_portfolio
      advanced:
        +schema: mart_advanced
      data_quality:
        +schema: mart_data_quality
